services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "8023:8022"
    volumes:
      - ./backend:/app
      - ./backend/config:/app/config
    environment:
      - GO_ENV=development
      - MQTT_BROKER_HOST=lwns.adarko.io
      - MQTT_BROKER_PORT=1883
      - MQTT_USERNAME=0f82700a-9219-4540-b3c2-1aefb93f0b9d
      - MQTT_PASSWORD=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJjaGlycHN0YWNrIiwiaXNzIjoiY2hpcnBzdGFjayIsInN1YiI6Ijc2OTZlNDViLTRiMDctNGY0MS1hNGExLTU1YjJkOWExOGY4OSIsInR5cCI6ImtleSJ9.Wwl1ReCxmvHWALpFESaeVvH-VCtnvAeHcrgib9Eh6O0
      - MQTT_APPLICATION_ID=8d765299-6bd2-4a9c-a841-7406785ff516
      - MQTT_TOPIC_PATTERN=application/8d765299-6bd2-4a9c-a841-7406785ff516/device/+/event/up
      - MQTT_CLIENT_ID=trackerhub-dev
      - MQTT_ENABLED=true
      - SERVER_PORT=8022
    depends_on:
      - mqtt-broker
    command: air
    networks:
      - trackerhub-net

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: development
    ports:
      - "3716:3715"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=/api
    depends_on:
      - backend
    networks:
      - trackerhub-net

  mqtt-broker:
    image: eclipse-mosquitto:2
    ports:
      - "1884:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - trackerhub-net

  postgres:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=trackerhub
      - POSTGRES_USER=trackerhub
      - POSTGRES_PASSWORD=trackerhub_pass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - trackerhub-net

  redis:
    image: redis:7-alpine
    ports:
      - "6373:6379"
    volumes:
      - redis-data:/data
    networks:
      - trackerhub-net

volumes:
  mosquitto-data:
  mosquitto-log:
  postgres-data:
  redis-data:

networks:
  trackerhub-net:
    driver: bridge
