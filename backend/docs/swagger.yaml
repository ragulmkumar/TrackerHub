basePath: /api
definitions:
  trackerHub_backend_internal_models.KalmanParams:
    properties:
      measurementVariance:
        description: Kalman filter measurement variance R
        minimum: 0
        type: number
      processVariance:
        description: Kalman filter process variance Q
        minimum: 0
        type: number
    required:
    - measurementVariance
    - processVariance
    type: object
  trackerHub_backend_internal_models.MQTTServerConfig:
    properties:
      applicationID:
        description: e.g., your OrgID
        type: string
      brokerHost:
        type: string
      brokerPort:
        type: integer
      clientID:
        type: string
      enabled:
        default: true
        type: boolean
      live_mqtt_status:
        description: Live MQTT connection status, not saved to file
        type: string
      password:
        type: string
      topicPattern:
        description: e.g., "/device_sensor_data/{ApplicationID}/+/+/+/+"
        type: string
      username:
        type: string
    required:
    - applicationID
    - brokerHost
    - brokerPort
    - topicPattern
    type: object
  trackerHub_backend_internal_models.ServerRuntimeConfig:
    properties:
      kalman:
        $ref: '#/definitions/trackerHub_backend_internal_models.KalmanParams'
      mqtt:
        $ref: '#/definitions/trackerHub_backend_internal_models.MQTTServerConfig'
      server:
        $ref: '#/definitions/trackerHub_backend_internal_models.WebServerConfig'
    type: object
  trackerHub_backend_internal_models.WebServerConfig:
    properties:
      port:
        description: Port for the HTTP/WebSocket server
        type: integer
    required:
    - port
    type: object
  trackerHub_backend_internal_models.WebUIBeaconConfig:
    properties:
      displayName:
        type: string
      macAddress:
        description: Physical MAC address if known
        type: string
      major:
        maximum: 65535
        minimum: 0
        type: integer
      minor:
        maximum: 65535
        minimum: 0
        type: integer
      txPower:
        description: RSSI at 1m
        type: integer
      uuid:
        description: iBeacon UUID
        type: string
      x:
        description: meters
        type: number
      "y":
        description: meters
        type: number
    required:
    - major
    - minor
    - txPower
    - uuid
    - x
    - "y"
    type: object
  trackerHub_backend_internal_models.WebUIConfig:
    properties:
      beacons:
        items:
          $ref: '#/definitions/trackerHub_backend_internal_models.WebUIBeaconConfig'
        type: array
      map:
        allOf:
        - $ref: '#/definitions/trackerHub_backend_internal_models.WebUIMapInfo'
        description: Map can be optional initially
      settings:
        $ref: '#/definitions/trackerHub_backend_internal_models.WebUISettings'
    required:
    - beacons
    - settings
    type: object
  trackerHub_backend_internal_models.WebUIMapEntity:
    properties:
      closed:
        type: boolean
      fillColor:
        description: If supporting filled shapes
        type: string
      lineWidth:
        description: in pixels
        type: number
      points:
        description: List of [x, y] coordinates
        items:
          items:
            format: float64
            type: number
          type: array
        minItems: 2
        type: array
      strokeColor:
        description: e.g., '#333333'
        type: string
      type:
        description: e.g., 'polyline'
        enum:
        - polyline
        type: string
    required:
    - points
    - type
    type: object
  trackerHub_backend_internal_models.WebUIMapInfo:
    properties:
      entities:
        items:
          $ref: '#/definitions/trackerHub_backend_internal_models.WebUIMapEntity'
        type: array
      height:
        description: in meters
        type: number
      name:
        type: string
      width:
        description: in meters
        type: number
    required:
    - height
    - width
    type: object
  trackerHub_backend_internal_models.WebUISettings:
    properties:
      signalPropagationFactor:
        description: Path loss exponent 'n'
        maximum: 6
        minimum: 1
        type: number
    required:
    - signalPropagationFactor
    type: object
host: localhost:8022
info:
  contact:
    email: support@trackerhub.com
    name: API Support
  description: Indoor positioning system API for tracking BLE devices
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: TrackerHub API
  version: "1.0"
paths:
  /api/config/web:
    get:
      consumes:
      - application/json
      description: Returns the current web UI configuration including beacon positions
        and map settings
      produces:
      - application/json
      responses:
        "200":
          description: Web UI configuration
          schema:
            $ref: '#/definitions/trackerHub_backend_internal_models.WebUIConfig'
        "500":
          description: Failed to load configuration
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get web UI configuration
      tags:
      - Configuration
    post:
      consumes:
      - application/json
      description: Updates the web UI configuration with new beacon positions or map
        settings
      parameters:
      - description: Web UI configuration
        in: body
        name: config
        required: true
        schema:
          $ref: '#/definitions/trackerHub_backend_internal_models.WebUIConfig'
      produces:
      - application/json
      responses:
        "200":
          description: Configuration updated successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to save configuration
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update web UI configuration
      tags:
      - Configuration
  /api/server-runtime-config:
    get:
      consumes:
      - application/json
      description: Returns the current server runtime configuration including MQTT
        and Kalman filter settings
      produces:
      - application/json
      responses:
        "200":
          description: Server runtime configuration
          schema:
            $ref: '#/definitions/trackerHub_backend_internal_models.ServerRuntimeConfig'
        "500":
          description: Failed to load configuration
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get server runtime configuration
      tags:
      - Configuration
    post:
      consumes:
      - application/json
      description: Updates the server runtime configuration including MQTT broker
        settings and Kalman filter parameters
      parameters:
      - description: Server runtime configuration
        in: body
        name: config
        required: true
        schema:
          $ref: '#/definitions/trackerHub_backend_internal_models.ServerRuntimeConfig'
      produces:
      - application/json
      responses:
        "200":
          description: Configuration updated successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to save configuration
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update server runtime configuration
      tags:
      - Configuration
  /api/trackers:
    get:
      consumes:
      - application/json
      description: Returns the current state of all active trackers including their
        positions
      produces:
      - application/json
      responses:
        "200":
          description: Map of tracker states
          schema:
            additionalProperties: true
            type: object
      summary: Get all tracker states
      tags:
      - Trackers
schemes:
- http
swagger: "2.0"
