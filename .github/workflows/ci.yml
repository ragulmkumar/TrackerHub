name: CI

on:
  push:
    branches: [main, develop, "feature/*", "release/*", "hotfix/*"]
  pull_request:
    branches: [main, develop, "feature/*", "release/*", "hotfix/*"]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25.6"
          cache: true

      - name: Verify go.mod
        run: go mod verify

      - name: Generate Swagger docs
        run: |
          cd backend
          go install github.com/swaggo/swag/cmd/swag@latest
          ~/go/bin/swag init -g cmd/server/main.go -o docs --parseDependency --parseInternal

      - name: Run go vet
        run: go vet ./backend/...

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.57.2

      - name: Run golangci-lint
        run: golangci-lint run ./backend/...

      - name: Run tests
        run: go test -v -coverprofile=coverage.out ./backend/...

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: cd client && npm ci

      - name: Run ESLint
        run: cd client && npm run lint

      - name: Build frontend
        run: cd client && npm run build

      - name: Run tests (if any)
        # Note: The client package.json does not have a test script, so we skip or run if exists.
        run: |
          cd client
          if [ -n "$(npm run -s test 2>/dev/null || echo '')" ]; then
            npm test
          else
            echo "No test script defined for frontend, skipping."
          fi

  docker-build:
    name: Build Docker Images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build development images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          target: development
          tags: backend-dev:ci
          load: true # Load the image into Docker daemon for potential next steps

      - name: Build frontend development image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./client/Dockerfile
          target: development
          tags: frontend-dev:ci
          load: true

      # Alternatively, we can build using docker-compose to ensure the compose file works
      - name: Build via docker-compose (development)
        run: |
          docker compose -f docker-compose-dev.yml config
          docker compose -f docker-compose-dev.yml build

      # Optionally, we can also build the production images to ensure they build
      - name: Build production images
        run: |
          docker compose -f docker-compose-prod.yml config
          docker compose -f docker-compose-prod.yml build
