name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine branch/tag name
        id: meta
        run: |
          # For pull request events, use the head branch; otherwise, use the ref name (branch or tag)
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "branch_name=${{ github.head_ref }}" >> $GITHUB_OUTPUT
          else
            echo "branch_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/backend:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/backend:${{ steps.meta.outputs.branch_name }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/{1}:latest', github.repository_owner, 'backend') || '' }}
          target: production

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/frontend:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/frontend:${{ steps.meta.outputs.branch_name }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/{1}:latest', github.repository_owner, 'frontend') || '' }}
          target: production

      - name: Output image URLs
        run: |
          echo "Backend image: ghcr.io/${{ github.repository_owner }}/backend"
          echo "Frontend image: ghcr.io/${{ github.repository_owner }}/frontend"
