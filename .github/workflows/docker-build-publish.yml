name: Build and Publish Docker Images

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/trackerhub-backend:${{ steps.vars.outputs.sha_short }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/trackerhub-backend:latest', github.repository_owner) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/trackerhub-frontend:${{ steps.vars.outputs.sha_short }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/trackerhub-frontend:latest', github.repository_owner) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Cleanup old images (primary)
        id: cleanup
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Function to cleanup an image keeping only the most recent N versions
          cleanup_image() {
            local image=$1
            local keep=$2
            
            # Get list of image versions sorted by creation date (newest first)
            mapfile -t versions < <(gh api \
              -H "Accept: application/vnd.github+json" \
              /repos/${{ github.repository_owner }}/${{ github.repository }}/container/packages/$image/versions \
              --jq '.[] | {name: .name, created_at: .created_at}' | 
              sort -r -k 2,2 | 
              jq -r '.[].name')
            
            # If we have fewer or equal to keep versions, nothing to delete
            if [ ${#versions[@]} -le $keep ]; then
              echo "No old versions to delete for $image (current count: ${#versions[@]})"
              return 0
            fi
            
            echo "Deleting old versions for $image (keeping latest $keep, removing ${#versions[@]} - $keep)"
            
            # Delete all but the first $keep versions
            for i in "${!versions[@]:$keep}"; do
              echo "Deleting version: ${versions[$i]}"
              if ! gh api \
                -X DELETE \
                -H "Accept: application/vnd.github+json" \
                /repos/${{ github.repository_owner }}/${{ github.repository }}/container/packages/$image/versions/${versions[$i]}; then
                echo "Failed to delete version ${versions[$i]}"
                return 1
              fi
            done
          }

          # Cleanup backend and frontend images (keep 10 most recent)
          cleanup_image "trackerhub-backend" 10 || echo "Primary cleanup failed for backend"
          cleanup_image "trackerhub-frontend" 10 || echo "Primary cleanup failed for frontend"

      - name: Fallback cleanup
        if: failure() && steps.cleanup.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Function to cleanup an image keeping only the most recent N versions
          cleanup_image() {
            local image=$1
            local keep=$2
            
            # Get list of image versions sorted by creation date (newest first)
            mapfile -t versions < <(gh api \
              -H "Accept: application/vnd.github+json" \
              /repos/${{ github.repository_owner }}/${{ github.repository }}/container/packages/$image/versions \
              --jq '.[] | {name: .name, created_at: .created_at}' | 
              sort -r -k 2,2 | 
              jq -r '.[].name')
            
            # If we have fewer or equal to keep versions, nothing to delete
            if [ ${#versions[@]} -le $keep ]; then
              echo "No old versions to delete for $image (current count: ${#versions[@]})"
              return 0
            fi
            
            echo "Deleting old versions for $image (keeping latest $keep, removing ${#versions[@]} - $keep)"
            
            # Delete all but the first $keep versions
            for i in "${!versions[@]:$keep}"; do
              echo "Deleting version: ${versions[$i]}"
              if ! gh api \
                -X DELETE \
                -H "Accept: application/vnd.github+json" \
                /repos/${{ github.repository_owner }}/${{ github.repository }}/container/packages/$image/versions/${versions[$i]}; then
                echo "Failed to delete version ${versions[$i]}"
                exit 1
              fi
            done
          }

          # Cleanup backend and frontend images (keep 10 most recent)
          cleanup_image "trackerhub-backend" 10
          cleanup_image "trackerhub-frontend" 10
