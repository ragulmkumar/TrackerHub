services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    ports:
      - "8022:8022"
    environment:
      - ENV=production
      - MQTT_BROKER_HOST=lwns.adarko.io
      - MQTT_BROKER_PORT=1883
      - MQTT_USERNAME=0f82700a-9219-4540-b3c2-1aefb93f0b9d
      - MQTT_PASSWORD=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJjaGlycHN0YWNrIiwiaXNzIjoiY2hpcnBzdGFjayIsInN1YiI6Ijc2OTZlNDViLTRiMDctNGY0MS1hNGExLTU1YjJkOWExOGY4OSIsInR5cCI6ImtleSJ9.Wwl1ReCxmvHWALpFESaeVvH-VCtnvAeHcrgib9Eh6O0
      - MQTT_APPLICATION_ID=8d765299-6bd2-4a9c-a841-7406785ff516
      - MQTT_TOPIC_PATTERN=application/8d765299-6bd2-4a9c-a841-7406785ff516/device/+/event/up
      - MQTT_CLIENT_ID=trackerhub-prod
      - MQTT_ENABLED=true
      - SERVER_PORT=8022
    depends_on:
      - mqtt-broker
    networks:
      - trackerhub-net

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: production
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:8022/api
    depends_on:
      - backend
    networks:
      - trackerhub-net

  mqtt-broker:
    image: eclipse-mosquitto:2
    ports:
      - "1884:1883"
      - "9001:9001"
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - trackerhub-net

volumes:
  mosquitto-data:
  mosquitto-log:

networks:
  trackerhub-net:
    driver: bridge
